server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Timeout pra APIs lentas (diet generation, etc) ─────────────────────
    proxy_read_timeout 90s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;

    # ── SPA fallback ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        # Nunca cachear HTML — sempre buscar nova versão pós-deploy
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Cache agressivo pra assets com hash (JS/CSS do Angular) ────────────
    # Seguro porque o nome do arquivo muda a cada build (outputHashing: "all")
    # Fallback: se arquivo não existe, tenta servir de /usr/share/nginx/html/old/
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ @fallback;
    }

    # ── Fallback: serve arquivos antigos se o novo não existe ───────────────
    location @fallback {
        rewrite ^/(.*)$ /old/$1 break;
        root /usr/share/nginx/html;
    }

    # ── Service Worker (nunca cachear) ──────────────────────────────────────
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Proxy pra API removido de propósito (2026-07-29) ────────────────────
    # Antes proxyava /api/ e as rotas (auth|admin|...) direto pro container "api:3000".
    # Isso quebrava a subida do nginx: proxy_pass estático é resolvido pelo nginx UMA VEZ
    # no boot (não sob demanda) — se "api" não existisse ainda na rede Docker naquele
    # instante (container recém-criado, rede recém-criada, ordem de subida), o nginx
    # morria inteiro com "host not found in upstream", derrubando o dashboard junto.
    # environment.prod.ts (Angular) já chama a API por URL absoluta cross-subdomain
    # (https://api.evovidafit.fitness), então esse proxy não é mais usado em produção —
    # ver vidafit-api/nginx/nginx.conf pro roteamento real por hostname.

    # ── Segurança ──────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
